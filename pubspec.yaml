name: news_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  flutter_spinkit: ^5.2.1
  cupertino_icons: ^1.0.8
  share_plus: ^11.0.0
  timeago: ^3.7.1
  url_launcher: ^6.3.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  audioplayers: ^6.4.0
  flutter_switch: ^0.3.2
  connectivity_plus: ^6.1.4
  internet_connection_checker: ^3.0.1
  build_runner: ^2.16.1
  freezed: ^4.0.2
  freezed_annotation: ^3.1.0
  json_serializable: ^6.14.1
  json_annotation: ^4.12.0
  dio: ^5.11.1
  retrofit: ^4.10.0
  retrofit_generator: ^10.2.11
  get_it: ^7.6.4
  flutter_bloc: ^8.1.3
  go_router: ^18.0.1
  pretty_dio_logger: ^1.4.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  drift_dev: ^2.35.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:

  assets:
    - images/
    - assets/
  uses-material-design: true

  fonts:
    - family: LibreBaskerville
      fonts:
        - asset: fonts/LibreBaskerville-Regular.ttf
